services:

  mysql:
    image: mysql:8.4
    container_name: creditcard_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  django:
    build:
      context: ./django_backend

    container_name: creditcard_django
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "


  fastapi:
    build:
      context: ./fastapi_backend

    container_name: creditcard_fastapi
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    ports:
      - "8001:8001"

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: creditcard_frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - django
      - fastapi


volumes:
  mysql_data: